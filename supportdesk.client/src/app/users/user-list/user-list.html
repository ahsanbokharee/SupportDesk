<h2>Users</h2>

<p><a routerLink="/users/new">+ New user</a></p>

<p *ngIf="errorMessage()">{{ errorMessage() }}</p>
<p *ngIf="!users() && !errorMessage()"><em>Loading...</em></p>

<table *ngIf="users() as list">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Role</th>
      <th>Status</th>
      <th>Created</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of list">
      <td>{{ user.firstName }} {{ user.lastName }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.role }}</td>
      <td>{{ user.isActive ? 'Active' : 'Inactive' }}</td>
      <td>{{ user.createdAt | date:'dd-MMM-yyyy' }}</td>
      <td><a [routerLink]="['/users', user.id, 'edit']">Edit</a></td>
    </tr>
  </tbody>
</table>

<h2>{{ isEdit ? 'Edit user' : 'New user' }}</h2>

<p *ngIf="loading()">Loading...</p>

<form *ngIf="!loading()" [formGroup]="form" (ngSubmit)="submit()">
  <div>
    <label for="firstName">First name</label><br>
    <input id="firstName" formControlName="firstName">
    <div *ngIf="form.controls.firstName.touched && form.controls.firstName.errors?.['required']">
      First name is required.
    </div>
  </div>

  <div>
    <label for="lastName">Last name</label><br>
    <input id="lastName" formControlName="lastName">
    <div *ngIf="form.controls.lastName.touched && form.controls.lastName.errors?.['required']">
      Last name is required.
    </div>
  </div>

  <div>
    <label for="email">Email</label><br>
    <input id="email" type="email" formControlName="email">
    <div *ngIf="form.controls.email.touched && form.controls.email.errors?.['required']">
      Email is required.
    </div>
    <div *ngIf="form.controls.email.touched && form.controls.email.errors?.['email']">
      Enter a valid email address.
    </div>
  </div>

  <div *ngIf="!isEdit">
    <label for="password">Initial password</label><br>
    <input id="password" type="password" formControlName="password" autocomplete="new-password">
    <div *ngIf="form.controls.password.touched && form.controls.password.errors?.['required']">
      Password is required.
    </div>
    <div *ngIf="form.controls.password.touched && form.controls.password.errors?.['minlength']">
      Password must be at least 8 characters.
    </div>
  </div>

  <div>
    <label for="role">Role</label><br>
    <select id="role" formControlName="role">
      <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
    </select>
  </div>

  <div *ngIf="isEdit">
    <label>
      <input type="checkbox" formControlName="isActive"> Active
    </label>
  </div>

  <p *ngIf="errorMessage()">{{ errorMessage() }}</p>

  <button type="submit" [disabled]="saving()">
    {{ saving() ? 'Saving...' : (isEdit ? 'Save changes' : 'Create user') }}
  </button>
  <a routerLink="/users">Cancel</a>
</form>
